      restore_slot: 'b'
      save_slot: 'a'
      jobs: ${{ inputs.jobs }}

  s12:
    needs: s11
    if: ${{ !cancelled() && needs.s11.result != 'skipped' && needs.s11.outputs.finished != 'true' && needs.s11.outputs.deterministic != 'true' }}
