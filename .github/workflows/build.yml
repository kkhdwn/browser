  s10:
    needs: s09
    if: ${{ !cancelled() && needs.s09.result != 'skipped' && needs.s09.outputs.finished != 'true' && needs.s09.outputs.deterministic != 'true' }}
    uses: ./.github/workflows/stage.yml
    secrets: inherit
    with:
      stage: 10
      arch: ${{ inputs.arch }}
