name: upstream-watch

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare pin with the newest Android stable
        id: check
        run: |
          set -euo pipefail
          PINNED="$(tr -d '[:space:]' < chromium.pin)"
          LATEST="$(curl -fsSL 'https://chromiumdash.appspot.com/fetch_releases?channel=Stable&platform=Android&num=1' | jq -r '.[0].version')"
          case "$LATEST" in
            ''|null|*[!0-9.]*) echo "cannot read newest version"; exit 1 ;;
          esac
          echo "pinned=$PINNED latest=$LATEST"
          if [ "$(printf '%s\n%s\n' "$PINNED" "$LATEST" | sort -V | tail -n1)" = "$PINNED" ]; then
            echo "newer=false" >> "$GITHUB_OUTPUT"
          else
            echo "newer=true" >> "$GITHUB_OUTPUT"
            echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          fi

      - name: Announce new stable
        if: steps.check.outputs.newer == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="Chromium ${{ steps.check.outputs.latest }} is out"
          if gh issue list -R "$GITHUB_REPOSITORY" --state all --search "\"$TITLE\" in:title" --json title -q '.[].title' | grep -qxF "$TITLE"; then
            echo "issue already exists"
            exit 0
          fi
          gh label create upstream -R "$GITHUB_REPOSITORY" --color 2A4485 --description "New Chromium stable" 2>/dev/null || true
          {
            echo "Android stable moved from \`$(tr -d '[:space:]' < chromium.pin)\` to \`${{ steps.check.outputs.latest }}\`."
            echo
            echo "A release build starts automatically (set the repository variable \`AUTO_BUILD\` to \`0\` to stop that)."
            echo "If the patch series no longer applies, the build fails and a \`build-failure\` issue is opened."
          } > body.md
          gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --label upstream --body-file body.md

      # On by default: the whole point is that a new Android stable produces a
      # new APK without anyone touching the repository. Set the repository
      # variable AUTO_BUILD=0 to switch the automatic build off.
      - name: Start a release build
        if: steps.check.outputs.newer == 'true' && vars.AUTO_BUILD != '0'
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run build.yml -R "$GITHUB_REPOSITORY" --ref main \
            -f version='${{ steps.check.outputs.latest }}' -f arch=arm64 -f kind=release -f fresh=false
